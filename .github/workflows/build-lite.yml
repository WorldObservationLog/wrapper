name: build-lite

on:
  push:
    branches: [ lite ]
  workflow_dispatch:

jobs:
  build-wrapper-lite:
    name: Build wrapper-lite (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip git aria2

      - name: Download Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Restore busybox-static package
        run: |
          cd "$GITHUB_WORKSPACE"
          apt-get download busybox-static

      - name: Configure and build wrapper-lite (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target wrapper_lite_exe wrapper_lite_rootless_exe -j$(nproc)
          cmake --build build -j$(nproc)

      - name: Build QEMU assets
        run: |
          chmod +x qemu/*.sh
          ./qemu/mkdata.sh
          ./qemu/build.sh

      - name: Package native release
        shell: bash
        run: |
          mkdir -p dist-native
          cp wrapper-lite dist-native/
          cp wrapper-lite-rootless dist-native/
          cp -R rootfs dist-native/
          cp README.md dist-native/
          cp LICENSE dist-native/

      - name: Upload wrapper-lite native package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-linux-x86_64
          path: dist-native

      - name: Package QEMU assets
        shell: bash
        run: |
          mkdir -p dist-qemu-assets
          cp qemu/vmlinuz-lite-qemu dist-qemu-assets/
          cp qemu/lite-initramfs.cpio.gz dist-qemu-assets/
          cp qemu/data.img dist-qemu-assets/
          cp README.md dist-qemu-assets/
          cp LICENSE dist-qemu-assets/

      - name: Upload QEMU assets
        uses: actions/upload-artifact@v7
        with:
          name: qemu-assets
          path: dist-qemu-assets

  build-wrapper-lite-qemu-android:
    name: Package wrapper-lite-qemu (android-aarch64)
    needs: build-wrapper-lite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Download generic QEMU assets
        uses: actions/download-artifact@v8
        with:
          name: qemu-assets
          path: qemu-assets

      - name: Download Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Build Android launcher
        run: |
          ./android-ndk-r23b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android22-clang++             -std=c++11 -O2 -s -nostdlib++ -lc++_static -lc++abi             -o wrapper-lite-qemu wrapper-lite-qemu.cpp

      - name: Download and bundle Termux QEMU (binary + firmware)
        shell: bash
        run: |
          set -euo pipefail
          PKGS=$(mktemp)
          curl -sL -o "$PKGS" https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages
          resolve_file() {
            awk -v pkg="$1" '
              $0 == "Package: " pkg { p=1 }
              p && /^Filename:/ { print $2; exit }
            ' "$PKGS"
          }
          HEADLESS=$(resolve_file qemu-system-x86-64-headless)
          COMMON=$(resolve_file qemu-common)
          [ -n "$HEADLESS" ] && [ -n "$COMMON" ]
          BASE=https://packages.termux.dev/apt/termux-main
          mkdir -p termux-qemu
          curl -sL -o termux-qemu/headless.deb "$BASE/${HEADLESS//:/%3a}"
          curl -sL -o termux-qemu/common.deb "$BASE/${COMMON//:/%3a}"
          dpkg-deb -x termux-qemu/headless.deb termux-qemu/headless
          dpkg-deb -x termux-qemu/common.deb termux-qemu/common
          HP=termux-qemu/headless/data/data/com.termux/files/usr
          CP=termux-qemu/common/data/data/com.termux/files/usr
          mkdir -p dist/qemu/bin
          cp "$HP/bin/qemu-system-x86_64" dist/qemu/bin/
          cp -R "$CP/share/qemu/." dist/qemu/bin/
          chmod +x dist/qemu/bin/qemu-system-x86_64

      - name: Assemble Android package
        shell: bash
        run: |
          mkdir -p dist/qemu
          cp qemu-assets/vmlinuz-lite-qemu dist/qemu/
          cp qemu-assets/lite-initramfs.cpio.gz dist/qemu/
          cp qemu-assets/data.img dist/qemu/
          cp wrapper-lite-qemu dist/
          cp README.md dist/
          cp LICENSE dist/

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-qemu-android-aarch64
          path: dist

  build-wrapper-lite-qemu:
    name: Package wrapper-lite-qemu (${{ matrix.name }})
    needs: build-wrapper-lite
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact_suffix: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            artifact_suffix: linux-aarch64
          - name: windows-x86_64
            os: windows-2022
            artifact_suffix: windows-x86_64
          - name: macos-aarch64
            os: macos-14
            artifact_suffix: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Download QEMU assets
        uses: actions/download-artifact@v8
        with:
          name: qemu-assets
          path: qemu-assets

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 seabios ipxe-qemu

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install qemu -y --no-progress

      - name: Build launcher
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            g++ -std=c++11 -O2 -static -o wrapper-lite-qemu.exe wrapper-lite-qemu.cpp
          else
            c++ -std=c++11 -O2 -o wrapper-lite-qemu wrapper-lite-qemu.cpp
          fi

      - name: Assemble QEMU package
        shell: bash
        run: |
          mkdir -p dist/qemu/bin
          cp -R qemu-assets/* dist/qemu/
          cp README.md dist/
          cp LICENSE dist/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp wrapper-lite-qemu.exe dist/
          else
            cp wrapper-lite-qemu dist/
          fi

      - name: Copy QEMU binary and firmware (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e  # each bundle sub-step is best-effort; report but never fail
          cp "$(command -v qemu-system-x86_64)" dist/qemu/bin/ 2>/dev/null || true
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp -R "$(brew --prefix)/share/qemu/"* dist/qemu/bin/ 2>/dev/null || true
          else
            # bundle QEMU firmware + SeaBIOS + option ROMs so the launcher's
            # `-L dist/qemu/bin` is self-contained
            cp -R /usr/share/qemu/. dist/qemu/bin/ 2>/dev/null || true
            cp -R /usr/share/seabios/. dist/qemu/bin/ 2>/dev/null || true
            cp -R /usr/lib/ipxe/qemu/. dist/qemu/bin/ 2>/dev/null || true
            # Bundle the shared libraries the QEMU binary needs into
            # dist/qemu/lib. glibc itself is deliberately NOT bundled: the
            # dynamic loader (ld-linux-x86-64.so.2) always comes from the host
            # and cannot be replaced through LD_LIBRARY_PATH, so shipping this
            # runner's libc.so.6/libm.so.6 next to QEMU makes it segfault
            # before main() on every host whose glibc differs from the
            # runner's - i.e. on every distro except the one used here.
            mkdir -p dist/qemu/lib
            ldd "$(command -v qemu-system-x86_64)" 2>/dev/null | \
              awk '/=> \// {print $3}' | sort -u | \
              while read -r so; do
                [ -f "$so" ] || continue
                case "${so##*/}" in
                  libc.so.6|libm.so.6|ld-linux*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libnss_*|libutil.so*|libanl.so*|libBrokenLocale.so*|libthread_db.so*)
                    echo "  not bundling glibc component: ${so##*/}" ;;
                  *)
                    cp -n "$so" dist/qemu/lib/ 2>/dev/null || true ;;
                esac
              done
            # Hard guarantee that no glibc slipped into the package next to the
            # QEMU binary; without this the build only works on this runner.
            if ls dist/qemu/bin/libc.so.6 dist/qemu/bin/libm.so.6 >/dev/null 2>&1; then
              echo "::error::glibc was copied into dist/qemu/bin; the package would crash on other distros"
              exit 1
            fi
            # bundle QEMU accel/device modules (QEMU_MODULE_DIR points here).
            # Resolve the module dir by locating an accel .so in the installed
            # tree; the dir name differs between x86_64/aarch64 runners and
            # the modules may live in a different package than the binary.
            MODDIR="$(find /usr/lib /usr/lib64 -type f -name 'accel-*.so' 2>/dev/null | xargs -r dirname | sort -u | head -1)"
            if [ -n "$MODDIR" ] && [ -d "$MODDIR" ]; then
              cp -R "$MODDIR/." dist/qemu/bin/ 2>/dev/null || true
            fi
          fi

      - name: Copy QEMU binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qemuDir = $null
          $q = Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue
          if ($q) { $qemuDir = Split-Path $q.Source }
          if (-not $qemuDir) {
            $candidates = @(
              'C:/Program Files/qemu',
              'C:/ProgramData/chocolatey/bin'
            )
            $qemuDir = $candidates | Where-Object { Test-Path (Join-Path $_ 'qemu-system-x86_64.exe') } | Select-Object -First 1
          }
          if (-not $qemuDir) { Write-Error 'qemu-system-x86_64.exe not found'; exit 1 }
          $dst = Join-Path (Join-Path 'dist' 'qemu') 'bin'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $qemuDir 'qemu-system-x86_64.exe') $dst
          Get-ChildItem (Join-Path $qemuDir '*.dll') -File | ForEach-Object { Copy-Item $_.FullName $dst }
          # bundle firmware (bios-256k.bin, vgabios, option ROMs) for `-L bin`
          $share = Join-Path $qemuDir 'share'
          if (Test-Path $share) {
            Copy-Item -Recurse -Force (Join-Path $share '*') $dst
          } else {
            $bios = Get-ChildItem -Path $qemuDir -Recurse -Filter 'bios-256k.bin' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($bios) { Copy-Item -Recurse -Force (Join-Path $bios.DirectoryName '*') $dst }
          }
      - name: Upload QEMU package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-qemu-${{ matrix.artifact_suffix }}
          path: dist

  # Runs the packaged launcher on a glibc that is *different* from the build
  # runner's. The package is assembled on ubuntu-22.04 (oldest supported
  # runner, for the widest compatibility) and must still work on newer
  # releases; before this job existed, a regression like shipping the build
  # machine's glibc could only be noticed by users.
  verify-qemu-package:
    name: Verify wrapper-lite-qemu (${{ matrix.os }})
    needs: build-wrapper-lite-qemu
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download the packaged launcher
        uses: actions/download-artifact@v8
        with:
          name: wrapper-lite-qemu-linux-x86_64
          path: pkg

      # Uploading/downloading an artifact drops the executable bit, so the
      # binaries arrive as regular files and cannot be run as-is.
      - name: Restore executable bits
        run: |
          set -euo pipefail
          chmod +x pkg/wrapper-lite-qemu
          chmod +x pkg/qemu/bin/qemu-system-x86_64

      - name: Fail if the package ships its build machine's glibc
        run: |
          set -euo pipefail
          for bad in libc.so.6 libm.so.6 ld-linux-x86-64.so.2; do
            if [ -e "pkg/qemu/bin/$bad" ]; then
              echo "::error::pkg/qemu/bin/$bad comes from the build runner; QEMU would crash on any host with a different glibc"
              exit 1
            fi
          done
          ls -l pkg/wrapper-lite-qemu pkg/qemu/bin/qemu-system-x86_64

      - name: The QEMU binary must load with this host's loader
        run: |
          set -euo pipefail
          # Deliberately no LD_LIBRARY_PATH: this is exactly what breaks when
          # the package carries its own glibc.
          pkg/qemu/bin/qemu-system-x86_64 --version

      - name: Boot the guest through the launcher and query /status
        run: |
          set -euo pipefail
          chmod +x pkg/wrapper-lite-qemu
          ( cd pkg && ./wrapper-lite-qemu --accel tcg --host-port 12340 > qemu.log 2>&1 & )
          ok=""
          for _ in $(seq 1 150); do
            if curl -fsS --max-time 3 http://127.0.0.1:12340/status > status.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          echo "--- launcher log ---"
          tail -n 30 pkg/qemu.log || true
          echo "--- /status ---"
          cat status.json 2>/dev/null || true
          [ -n "$ok" ] || { echo "::error::the service never answered on 127.0.0.1:12340"; exit 1; }
          grep -q '"code":0' status.json
          # the launcher must have started the QEMU that ships with the package
          grep -q 'qemu=.*qemu/bin/qemu-system-x86_64' pkg/qemu.log

      - name: Stop the guest
        if: always()
        run: pkill -f wrapper-lite-qemu || true
