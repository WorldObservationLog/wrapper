name: build-lite

on:
  push:
    branches: [ lite ]
  workflow_dispatch:

jobs:
  build-wrapper-lite:
    name: Build wrapper-lite (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip git aria2

      - name: Download Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Restore busybox-static package
        run: |
          cd "$GITHUB_WORKSPACE"
          apt-get download busybox-static

      - name: Configure and build wrapper-lite (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target wrapper_lite_exe wrapper_lite_rootless_exe -j$(nproc)
          cmake --build build -j$(nproc)

      - name: Build QEMU assets
        run: |
          chmod +x qemu/*.sh
          ./qemu/mkdata.sh
          ./qemu/build.sh

      - name: Package native release
        shell: bash
        run: |
          mkdir -p dist-native
          cp wrapper-lite dist-native/
          cp wrapper-lite-rootless dist-native/
          cp -R rootfs dist-native/
          cp README.md dist-native/
          cp LICENSE dist-native/

      - name: Upload wrapper-lite native package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-linux-x86_64
          path: dist-native

      - name: Package QEMU assets
        shell: bash
        run: |
          mkdir -p dist-qemu-assets
          cp qemu/vmlinuz-lite-qemu dist-qemu-assets/
          cp qemu/lite-initramfs.cpio.gz dist-qemu-assets/
          cp qemu/data.img dist-qemu-assets/
          cp README.md dist-qemu-assets/
          cp LICENSE dist-qemu-assets/

      - name: Upload QEMU assets
        uses: actions/upload-artifact@v7
        with:
          name: qemu-assets
          path: dist-qemu-assets

  build-wrapper-lite-qemu:
    name: Package wrapper-lite-qemu (${{ matrix.name }})
    needs: build-wrapper-lite
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact_suffix: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            artifact_suffix: linux-aarch64
          - name: windows-x86_64
            os: windows-2022
            artifact_suffix: windows-x86_64
          - name: macos-x86_64
            os: macos-13
            artifact_suffix: macos-x86_64
          - name: macos-aarch64
            os: macos-14
            artifact_suffix: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Download QEMU assets
        uses: actions/download-artifact@v8
        with:
          name: qemu-assets
          path: qemu-assets

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install qemu -y --no-progress

      - name: Build launcher
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            g++ -std=c++11 -O2 -o wrapper-lite-qemu.exe wrapper-lite-qemu.cpp
          else
            c++ -std=c++11 -O2 -o wrapper-lite-qemu wrapper-lite-qemu.cpp
          fi

      - name: Assemble QEMU package
        shell: bash
        run: |
          mkdir -p dist/qemu/bin
          cp -R qemu-assets/* dist/qemu/
          cp README.md dist/
          cp LICENSE dist/
          cp wrapper-lite-qemu* dist/

      - name: Copy QEMU binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "$(command -v qemu-system-x86_64)" dist/qemu/bin/

      - name: Copy QEMU binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $q = Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue
          if ($q) {
            Copy-Item $q.Source dist\qemu\bin\
          } else {
            $candidates = @(
              "C:\Program Files\qemu\qemu-system-x86_64.exe",
              "C:\ProgramData\chocolatey\bin\qemu-system-x86_64.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($found) { Copy-Item $found dist\qemu\bin\ }
            else { Write-Error "qemu-system-x86_64.exe not found"; exit 1 }
          }

      - name: Upload QEMU package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-qemu-${{ matrix.artifact_suffix }}
          path: dist
