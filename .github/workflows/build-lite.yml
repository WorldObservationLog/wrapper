name: build-lite

on:
  push:
    branches: [ lite ]
  workflow_dispatch:

jobs:
  build-wrapper-lite:
    name: Build wrapper-lite (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip git aria2

      - name: Download Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Restore busybox-static package
        run: |
          cd "$GITHUB_WORKSPACE"
          apt-get download busybox-static

      - name: Configure and build wrapper-lite (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target wrapper_lite_exe wrapper_lite_rootless_exe -j$(nproc)
          cmake --build build -j$(nproc)

      - name: Build QEMU assets
        run: |
          chmod +x qemu/*.sh
          ./qemu/mkdata.sh
          ./qemu/build.sh

      - name: Package native release
        shell: bash
        run: |
          mkdir -p dist-native
          cp wrapper-lite dist-native/
          cp wrapper-lite-rootless dist-native/
          cp -R rootfs dist-native/
          cp README.md dist-native/
          cp LICENSE dist-native/

      - name: Upload wrapper-lite native package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-linux-x86_64
          path: dist-native

      - name: Package QEMU assets
        shell: bash
        run: |
          mkdir -p dist-qemu-assets
          cp qemu/vmlinuz-lite-qemu dist-qemu-assets/
          cp qemu/lite-initramfs.cpio.gz dist-qemu-assets/
          cp qemu/data.img dist-qemu-assets/
          cp README.md dist-qemu-assets/
          cp LICENSE dist-qemu-assets/

      - name: Upload QEMU assets
        uses: actions/upload-artifact@v7
        with:
          name: qemu-assets
          path: dist-qemu-assets

  build-wrapper-lite-qemu-android:
    name: Package wrapper-lite-qemu (android-aarch64)
    needs: build-wrapper-lite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Download generic QEMU assets
        uses: actions/download-artifact@v8
        with:
          name: qemu-assets
          path: qemu-assets

      - name: Download Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Build Android launcher
        run: |
          ./android-ndk-r23b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android22-clang++             -std=c++11 -O2 -s -nostdlib++ -lc++_static -lc++abi             -o wrapper-lite-qemu wrapper-lite-qemu.cpp

      - name: Download and bundle Termux QEMU (binary + firmware)
        shell: bash
        run: |
          set -euo pipefail
          PKGS=$(mktemp)
          curl -sL -o "$PKGS" https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages
          resolve_file() {
            awk -v pkg="$1" '
              $0 == "Package: " pkg { p=1 }
              p && /^Filename:/ { print $2; exit }
            ' "$PKGS"
          }
          HEADLESS=$(resolve_file qemu-system-x86-64-headless)
          COMMON=$(resolve_file qemu-common)
          [ -n "$HEADLESS" ] && [ -n "$COMMON" ]
          BASE=https://packages.termux.dev/apt/termux-main
          mkdir -p termux-qemu
          curl -sL -o termux-qemu/headless.deb "$BASE/${HEADLESS//:/%3a}"
          curl -sL -o termux-qemu/common.deb "$BASE/${COMMON//:/%3a}"
          dpkg-deb -x termux-qemu/headless.deb termux-qemu/headless
          dpkg-deb -x termux-qemu/common.deb termux-qemu/common
          HP=termux-qemu/headless/data/data/com.termux/files/usr
          CP=termux-qemu/common/data/data/com.termux/files/usr
          mkdir -p dist/qemu/bin
          cp "$HP/bin/qemu-system-x86_64" dist/qemu/bin/
          cp -R "$CP/share/qemu/." dist/qemu/bin/
          chmod +x dist/qemu/bin/qemu-system-x86_64

      - name: Assemble Android package
        shell: bash
        run: |
          mkdir -p dist/qemu
          cp qemu-assets/vmlinuz-lite-qemu dist/qemu/
          cp qemu-assets/lite-initramfs.cpio.gz dist/qemu/
          cp qemu-assets/data.img dist/qemu/
          cp wrapper-lite-qemu dist/
          cp README.md dist/
          cp LICENSE dist/

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-qemu-android-aarch64
          path: dist

  build-wrapper-lite-qemu:
    name: Package wrapper-lite-qemu (${{ matrix.name }})
    needs: build-wrapper-lite
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            artifact_suffix: linux-x86_64
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            artifact_suffix: linux-aarch64
          - name: windows-x86_64
            os: windows-2022
            artifact_suffix: windows-x86_64
          - name: macos-aarch64
            os: macos-14
            artifact_suffix: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Download QEMU assets
        uses: actions/download-artifact@v8
        with:
          name: qemu-assets
          path: qemu-assets

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 seabios ipxe-qemu

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install qemu -y --no-progress

      - name: Build launcher
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            g++ -std=c++11 -O2 -static -o wrapper-lite-qemu.exe wrapper-lite-qemu.cpp
          else
            c++ -std=c++11 -O2 -o wrapper-lite-qemu wrapper-lite-qemu.cpp
          fi

      - name: Assemble QEMU package
        shell: bash
        run: |
          mkdir -p dist/qemu/bin
          cp -R qemu-assets/* dist/qemu/
          cp README.md dist/
          cp LICENSE dist/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp wrapper-lite-qemu.exe dist/
          else
            cp wrapper-lite-qemu dist/
          fi

      - name: Copy QEMU binary and firmware (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "$(command -v qemu-system-x86_64)" dist/qemu/bin/
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp -R "$(brew --prefix)/share/qemu/"* dist/qemu/bin/ 2>/dev/null || true
          else
            # bundle QEMU firmware + SeaBIOS + option ROMs so the launcher's
            # `-L dist/qemu/bin` is self-contained
            cp -R /usr/share/qemu/. dist/qemu/bin/ 2>/dev/null || true
            cp -R /usr/share/seabios/. dist/qemu/bin/ 2>/dev/null || true
            cp -R /usr/lib/ipxe/qemu/. dist/qemu/bin/ 2>/dev/null || true
            # bundle the dynamically-linked shared libraries the QEMU binary
            # needs (the launcher adds dist/qemu/bin to LD_LIBRARY_PATH)
            ldd "$(command -v qemu-system-x86_64)" | \
              awk '/=> \// {print $3}' | sort -u | \
              while read -r so; do
                [ -f "$so" ] && cp -n "$so" dist/qemu/bin/ || true
              done
            # bundle QEMU accel/device modules (QEMU_MODULE_DIR points here)
            MODDIR="$(dirname "$(command -v qemu-system-x86_64)")/../lib/x86_64-linux-gnu/qemu"
            [ -d "$MODDIR" ] || MODDIR="$(find /usr/lib /usr/lib64 -type d -name qemu 2>/dev/null | head -1)"
            if [ -n "$MODDIR" ] && [ -d "$MODDIR" ]; then
              cp -R "$MODDIR/." dist/qemu/bin/
            fi
          fi

      - name: Copy QEMU binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qemuDir = $null
          $q = Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue
          if ($q) { $qemuDir = Split-Path $q.Source }
          if (-not $qemuDir) {
            $candidates = @(
              'C:/Program Files/qemu',
              'C:/ProgramData/chocolatey/bin'
            )
            $qemuDir = $candidates | Where-Object { Test-Path (Join-Path $_ 'qemu-system-x86_64.exe') } | Select-Object -First 1
          }
          if (-not $qemuDir) { Write-Error 'qemu-system-x86_64.exe not found'; exit 1 }
          $dst = Join-Path (Join-Path 'dist' 'qemu') 'bin'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $qemuDir 'qemu-system-x86_64.exe') $dst
          Get-ChildItem (Join-Path $qemuDir '*.dll') -File | ForEach-Object { Copy-Item $_.FullName $dst }
          # bundle firmware (bios-256k.bin, vgabios, option ROMs) for `-L bin`
          $share = Join-Path $qemuDir 'share'
          if (Test-Path $share) {
            Copy-Item -Recurse -Force (Join-Path $share '*') $dst
          } else {
            $bios = Get-ChildItem -Path $qemuDir -Recurse -Filter 'bios-256k.bin' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($bios) { Copy-Item -Recurse -Force (Join-Path $bios.DirectoryName '*') $dst }
          }
      - name: Upload QEMU package
        uses: actions/upload-artifact@v7
        with:
          name: wrapper-lite-qemu-${{ matrix.artifact_suffix }}
          path: dist
