name: Build for x86_64

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install LLVM
      run: sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
    
    - name: Set up Android NDK r23b
      run: | 
        curl -fLO https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
        unzip -qd . android-ndk-r23b-linux.zip
      
    - name: Build
      run: |
        mkdir build
        cd build
        cmake ..
        make

    - name: Set outputs
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Create Release Zip File
      run: zip -r Wrapper.x86_64.latest.zip rootfs/ wrapper wrapper-rootless Dockerfile compose.yaml entrypoint.sh
      
    - name: Update Tag
      run: |
        git tag -f wrapper.x86_64.latest
        git push origin wrapper.x86_64.latest --force

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        files: Wrapper.x86_64.latest.zip
        body: |
          Latest build for x86_64.
          Commit: ${{ github.sha }}
          Message: ${{ github.event.head_commit.message }}
        name: Wrapper.x86_64.latest
        tag_name: wrapper.x86_64.latest
        make_latest: true
        overwrite: true

    # Both ExternalProject targets compile to ./wrapper, so a plain `make` leaves
    # whichever ran last. Re-make the privileged one explicitly: the image is
    # documented to run --privileged. Runs after the zip so the release is unchanged.
    - name: Rebuild privileged wrapper for the image
      run: cmake --build build --target wrapper_exe

    - name: Compute image name
      id: image
      run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,format=long
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Build and push Docker image (linux/amd64)
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
