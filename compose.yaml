services:
  app:
    # To run the published image instead of a local build, replace `build:`
    # with `image: ghcr.io/worldobservationlog/wrapper-lite:latest`.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NDK_VERSION: 23
    volumes:
      - ./rootfs/data:/app/rootfs/data
    ports:
      - "12340:12340"
    environment:
      USERNAME: ${USERNAME}
      PASSWORD: ${PASSWORD}
    security_opt:
      - seccomp:unconfined
